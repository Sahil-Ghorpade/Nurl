spring:
  application:
    name: Nurl

  datasource:
    url: jdbc:postgresql://localhost:5432/nurl
    username: postgres
    password: root

  jpa:
    show-sql: true

    hibernate:
      ddl-auto: update

    open-in-view: false

    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

server:
  port: 8080

logging:
  level:
    org.springframework.jdbc: INFO

jwt:
  secret: 7QeP3mL8ZxA1Vn5Kd9RwY2Ht6BcF4NsJ8QmX7LpE2ZvC5Tr
  access-token-expiration: 900000

app:
  base-url: http://localhost:8080

  reserved-aliases:
    - login
    - register
    - links
    - health
    - admin
    - api
    - link
    - actuator
    - swagger

  cleanup:
    retention-days: 30

    cron: "0 0 2 * *"