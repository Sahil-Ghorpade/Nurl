spring:
  application:
    name: Nurl

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nurl}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Existing Nurl schema"

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.springframework.jdbc: INFO

jwt:
  secret: ${JWT_SECRET:7QeP3sL8ZxA1Vn5Kd9RwY2Hr6BaF4NsJ8QmX7LqE2ZvC5Tr}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  reserved-aliases:
    - login
    - register
    - links
    - health
    - admin
    - api
    - link
    - actuator
    - swagger

  cleanup:
    retention-days: ${CLEANUP_RETENTION_DAYS:30}
    cron: ${CLEANUP_CRON:0 0 2 * * *}

  auth:
    cookie:
      name: ${AUTH_COOKIE_NAME:nurl_access_token}
      refresh-name: ${AUTH_REFRESH_COOKIE_NAME:nurl_refresh_token}
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never