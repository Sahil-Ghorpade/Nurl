spring:
  application:
    name: Nurl

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nurl}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}

  jpa:
    show-sql: false

    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.springframework.jdbc: INFO

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

  reserved-aliases:
    - login
    - register
    - links
    - health
    - admin
    - api
    - link
    - actuator
    - swagger

  cleanup:
    retention-days: ${CLEANUP_RETENTION_DAYS:30}
    cron: ${CLEANUP_CRON:0 0 2 * * *}

management:
  endpoints:
    web:
      exposure:
        include: health

  management:
    endpoints:
      web:
        exposure:
          include: health

    endpoint:
      health:
        show-details: never